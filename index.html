<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블라인드 마켓</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 font-sans">

    <div id="login-screen" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-sm w-full text-center space-y-4">
            <h1 class="text-2xl font-black text-amber-400">🎨 블라인드 마켓</h1>
            <input type="text" id="nickname-input" placeholder="닉네임" maxlength="10" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-center text-white font-bold">
            <input type="text" id="room-code-input" placeholder="방 코드" maxlength="6" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-center text-amber-300 font-mono font-bold uppercase">
            <div class="flex gap-2">
                <button onclick="createRoom()" class="flex-1 bg-amber-500 text-slate-950 font-black py-3 rounded-xl">방 만들기</button>
                <button onclick="joinRoom()" class="flex-1 bg-indigo-600 text-white font-black py-3 rounded-xl">참가</button>
            </div>
        </div>
    </div>

    <div id="game-screen" class="w-full max-w-3xl flex-1 flex flex-col gap-2.5 my-1 hidden">
        <header class="bg-slate-800 border border-slate-700 rounded-2xl p-3 flex flex-col gap-2">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <h1 class="font-black text-amber-400">블라인드 마켓</h1>
                    <span id="room-code-badge" class="bg-slate-900 text-amber-300 text-[10px] px-2 py-0.5 rounded font-mono"></span>
                    <button onclick="navigator.clipboard.writeText(location.origin + '/?room=' + currentRoomId); alert('링크 복사 완료!');" class="bg-indigo-600 text-[10px] px-2 py-1 rounded">초대링크</button>
                    <button onclick="leaveRoom()" class="bg-rose-600 text-[10px] px-2 py-1 rounded font-bold">방 나가기</button>
                </div>
                <div class="flex gap-2 text-xs">
                    <div>자금: <span id="my-money" class="text-emerald-400 font-bold">50P</span></div>
                    <div>점수: <span id="my-score" class="text-amber-300 font-bold">0점</span></div>
                </div>
            </div>
            <div id="players-status-bar" class="flex gap-2 overflow-x-auto border-t border-slate-700 pt-2"></div>
        </header>

        <div id="roadmap-wrapper" class="bg-slate-800/50 border border-slate-700 rounded-xl p-2 hidden">
            <div id="roadmap-bar" class="flex gap-1.5 overflow-x-auto"></div>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 text-center relative min-h-[140px] flex flex-col justify-center items-center">
            <div id="waiting-control-panel" class="space-y-3 w-full">
                <h2 id="room-master-notice" class="text-sm font-bold text-amber-300">준비 완료 후 시작하세요</h2>
                <div id="action-buttons-container"></div>
            </div>
            <div id="auction-display-panel" class="hidden space-y-1 w-full">
                <span id="item-category" class="bg-indigo-500/20 text-indigo-300 text-[10px] px-2 py-0.5 rounded"></span>
                <h2 id="item-name" class="text-xl font-black text-white"></h2>
                <p id="item-desc" class="text-xs text-slate-400"></p>
                <div id="announcement-box" class="hidden text-amber-300 text-xs font-bold mt-2"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5 flex-1">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-3 flex flex-col justify-between">
                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span>입찰 금액</span>
                        <span id="bid-status-text" class="text-slate-400">대기 중</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="number" id="bid-input" min="0" value="10" disabled class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 font-bold opacity-50">
                        <button onclick="submitBid()" id="bid-btn" disabled class="bg-indigo-600 text-white px-4 py-2 rounded-xl opacity-50">제출</button>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-3 flex flex-col h-40 md:h-auto">
                <div id="chat-messages" class="flex-1 overflow-y-auto text-xs space-y-1 mb-2"></div>
                <div class="flex gap-1">
                    <input type="text" id="chat-input" placeholder="채팅 입력..." onkeypress="if(event.key==='Enter')sendChat()" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs">
                    <button onclick="sendChat()" class="bg-slate-700 px-3 py-1.5 rounded-xl text-xs">전송</button>
                </div>
            </div>
        </div>
    </div>

    <div id="game-over-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 max-w-md w-full text-center space-y-3">
            <h2 class="text-2xl font-black text-amber-400">게임 종료!</h2>
            <div id="final-scoreboard" class="text-left space-y-1"></div>
            <button onclick="clearSession()" class="w-full bg-indigo-600 py-3 rounded-xl font-bold">로비로</button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoomId = '';
        let globalRoadmap = [];

        function getMyToken() {
            let token = localStorage.getItem('bm_token');
            if (!token) {
                token = 'tok_' + Math.random().toString(36).substring(2, 9);
                localStorage.setItem('bm_token', token);
            }
            return token;
        }

        socket.on('connect', () => {
            const savedRoom = localStorage.getItem('bm_room');
            const savedName = localStorage.getItem('bm_name');
            if (savedRoom && savedName) {
                socket.emit('join_room', { roomId: savedRoom, name: savedName, token: getMyToken() });
            }

            const urlParams = new URLSearchParams(location.search).get('room');
            if (urlParams) document.getElementById('room-code-input').value = urlParams;
        });

        function createRoom() {
            const name = document.getElementById('nickname-input').value.trim();
            if (!name) { alert('닉네임을 입력하세요'); return; }
            localStorage.setItem('bm_name', name);
            socket.emit('create_room', { name, token: getMyToken() });
        }

        function joinRoom() {
            const name = document.getElementById('nickname-input').value.trim();
            const roomId = document.getElementById('room-code-input').value.trim();
            if (!name || !roomId) { alert('닉네임과 방 코드를 입력하세요'); return; }
            localStorage.setItem('bm_name', name);
            localStorage.setItem('bm_room', roomId);
            socket.emit('join_room', { name, roomId, token: getMyToken() });
        }

        function leaveRoom() {
            if (confirm('정말 방을 나가시겠습니까?')) {
                socket.emit('leave_room', getMyToken());
            }
        }

        socket.on('left_room', () => {
            localStorage.removeItem('bm_room');
            location.href = '/';
        });

        function clearSession() {
            localStorage.removeItem('bm_room');
            localStorage.removeItem('bm_token');
            location.href = '/';
        }

        socket.on('joined_room', (data) => {
            currentRoomId = data.roomId;
            localStorage.setItem('bm_room', currentRoomId);
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('room-code-badge').innerText = currentRoomId;
        });

        socket.on('game_started', (data) => {
            globalRoadmap = data.roadmap;
            document.getElementById('waiting-control-panel').classList.add('hidden');
            document.getElementById('auction-display-panel').classList.remove('hidden');
            document.getElementById('roadmap-wrapper').classList.remove('hidden');
        });

        socket.on('update_game_state', (state) => {
            const myToken = getMyToken();
            const isHost = state.hostToken === myToken;
            const me = Object.values(state.players).find(p => p.token === myToken);

            document.getElementById('players-status-bar').innerHTML = Object.values(state.players).map(p => `
                <div class="bg-slate-900 border border-slate-700 px-2 py-1 rounded-lg text-xs flex gap-1 items-center shrink-0">
                    <span>${p.avatar}</span>
                    <span class="${p.color} font-bold">${p.name}</span>
                    <span class="text-emerald-400">${p.money}P</span>
                    <span class="text-amber-300">${p.score}점</span>
                    ${state.roomStatus === 'waiting' ? (p.token === state.hostToken ? '방장' : (p.isReady ? '✅' : '⏳')) : (typeof p.bid === 'number' ? '🔒' : '⏳')}
                </div>
            `).join('');

            if (state.roomStatus === 'waiting') {
                const ac = document.getElementById('action-buttons-container');
                if (isHost) {
                    ac.innerHTML = `<button onclick="socket.emit('start_game', '${myToken}')" class="w-full bg-indigo-600 py-2.5 rounded-xl font-bold">게임 시작</button>`;
                } else {
                    const ready = me && me.isReady;
                    ac.innerHTML = `<button onclick="socket.emit('toggle_ready', '${myToken}')" class="w-full ${ready ? 'bg-rose-600' : 'bg-emerald-600'} py-2.5 rounded-xl font-bold">${ready ? '준비 취소' : '준비 완료'}</button>`;
                }
            }

            if (me) {
                document.getElementById('my-money').innerText = me.money + 'P';
                document.getElementById('my-score').innerText = me.score + '점';
                
                const input = document.getElementById('bid-input');
                const btn = document.getElementById('bid-btn');
                if (state.roomStatus === 'bidding' && me.bid === null) {
                    input.disabled = false; input.classList.remove('opacity-50');
                    btn.disabled = false; btn.classList.remove('opacity-50');
                    document.getElementById('bid-status-text').innerText = '입찰 가능';
                } else {
                    input.disabled = true; input.classList.add('opacity-50');
                    btn.disabled = true; btn.classList.add('opacity-50');
                    if (me.bid !== null) document.getElementById('bid-status-text').innerText = '제출 완료 🔒';
                }
            }

            if (state.roomStatus === 'bidding' || state.roomStatus === 'revealing') {
                const item = globalRoadmap[state.currentRound];
                if (item) {
                    document.getElementById('item-category').innerText = item.category;
                    document.getElementById('item-name').innerText = item.name;
                    document.getElementById('item-desc').innerText = item.desc;
                }
            }

            if (state.roomStatus === 'ended') {
                document.getElementById('game-over-modal').classList.remove('hidden');
                let players = Object.values(state.players).sort((a,b)=>b.score-a.score);
                document.getElementById('final-scoreboard').innerHTML = players.map((p,i)=>`<div class="flex justify-between py-1 border-b border-slate-700"><span>${i+1}위: ${p.name}</span><span>${p.score}점 (${p.money}P)</span></div>`).join('');
            }
        });

        socket.on('round_result', (data) => {
            const box = document.getElementById('announcement-box');
            box.innerText = data.resultMsg;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 3500);
        });

        socket.on('receive_chat', (data) => {
            const box = document.getElementById('chat-messages');
            box.innerHTML += `<div class="text-[11px]"><span class="${data.color} font-bold">${data.name}:</span> ${data.message}</div>`;
            box.scrollTop = box.scrollHeight;
        });

        socket.on('error_msg', alert);

        function submitBid() {
            const val = parseInt(document.getElementById('bid-input').value);
            if (isNaN(val)) return;
            socket.emit('submit_bid', { bidAmount: val, token: getMyToken() });
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            if (!input.value.trim()) return;
            socket.emit('send_chat', { msg: input.value, token: getMyToken() });
            input.value = '';
        }
    </script>
</body>
</html>
